[client]
# "minimal" only shows menu items explicitly set in code (e.g. via
# st.set_page_config(menu_items=...)). Since this app sets none, the
# hamburger menu doesn't render for viewers at all. Separate from the
# Fork/GitHub badge on Community Cloud, which is controlled by repo
# visibility, not this setting.
toolbarMode = "minimal"

[theme]
# Without this section Streamlit's *native* widgets (st.warning/st.info,
# st.radio, st.number_input, st.button, st.metric, dataframes) fall back to
# Streamlit's own default theme rather than the design tokens defined in
# app.py's stylesheet — which is what previously made the "1D/1M" radio
# labels render white-on-light (invisible) and the Portfolio Qty/Buy Price
# inputs render dark. These values MUST stay in sync with the :root tokens
# at the top of app.py's <style> block.
base = "light"

primaryColor            = "#16A34A"   # --brand-strong (buttons, focus, active tab)
backgroundColor         = "#F6F7F9"   # --surface-page (tinted page behind cards)
secondaryBackgroundColor = "#FFFFFF"  # --surface-card (widget/card fill)
textColor               = "#0F172A"   # --ink
font = "sans serif"
